<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Document</title>
</head>
<body>
<p id="demo"></p>
<script>
const fruit=new Map();
fruit.set("apple",100);
fruit.set("mango",200);
fruit.set("orange",300);
let txt="";
for(const[key,value]of fruit.entries()){
txt+=key+":"+value+"<br>";
}
document.getElementById("demo").innerHTML=txt;
</script>
</body>
</html>
