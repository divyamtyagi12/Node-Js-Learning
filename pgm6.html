<!DOCTYPE html>
<html>
<head>
    <title>Number Pattern</title>
</head>
<body>

<pre id="pattern"></pre>

<script>
let output = "";

for (let i = 1; i <=5; i++) {
    for (let j = 1; j <= i; j++) {
        output += j;
    }
    for (let j = i - 1; j >= 1; j--) {
        output += j;
    }
    output += "\n";
}

document.getElementById("pattern").innerText = output;
</script>
</body>
</html>
